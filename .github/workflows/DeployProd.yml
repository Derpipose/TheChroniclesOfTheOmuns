name: Chronicles of the Omuns
run-name: Deploying to production
on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  deploy:
    runs-on: self-hosted
    env:
      COMPOSE_FILE: docker-compose.prod.yaml

    steps:
      - name: Check out repository code
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      - name: Backup database
        run: |
          if docker ps --format '{{.Names}}' | grep -q '^chronicles_prod_db$'; then
            TIMESTAMP=$(date +%Y%m%d_%H%M%S)
            BACKUP_PATH="/home/cotodev/backups/chronicles_prod_$TIMESTAMP.dmp"
            mkdir -p /home/cotodev/backups
            docker exec chronicles_prod_db \
              pg_dump -Fc -U ${{ secrets.PROD_DB_USER }} ${{ secrets.PROD_DB_NAME }} \
              > $BACKUP_PATH
            echo "BACKUP_PATH=$BACKUP_PATH" >> $GITHUB_ENV
            echo "Backup saved to $BACKUP_PATH"
          else
            echo "chronicles_prod_db not running yet, skipping backup (first deploy)"
          fi

      - name: Run tests
        run: dotnet test --verbosity normal

      - name: Write prod .env
        run: |
          cat > .env << EOF
          JWT_KEY=${{ secrets.JWT_KEY }}
          JWT_ISSUER=${{ secrets.JWT_ISSUER }}
          JWT_AUDIENCE=${{ secrets.JWT_AUDIENCE }}
          JWT_EXPIRY_HOURS=${{ secrets.JWT_EXPIRY_HOURS }}
          VITE_API_BASE_URL=${{ secrets.PROD_VITE_API_BASE_URL }}
          SMTP_HOST=${{ secrets.SMTP_HOST }}
          SMTP_PORT=${{ secrets.SMTP_PORT }}
          SMTP_USERNAME=${{ secrets.SMTP_USERNAME }}
          SMTP_PASSWORD=${{ secrets.SMTP_PASSWORD }}
          SMTP_FROM=${{ secrets.SMTP_FROM }}
          PROD_DB_USER=${{ secrets.PROD_DB_USER }}
          PROD_DB_PASSWORD=${{ secrets.PROD_DB_PASSWORD }}
          PROD_DB_NAME=${{ secrets.PROD_DB_NAME }}
          EOF

      - name: Shut down prod containers
        run: docker compose -f $COMPOSE_FILE down

      - name: Rebuild and start prod containers
        run: docker compose -f $COMPOSE_FILE up --build -d

      - name: Wait for database to be ready
        run: |
          echo "Waiting for database..."
          sleep 10
          docker exec chronicles_prod_db pg_isready -U ${{ secrets.PROD_DB_USER }}

      - name: Clean up old backups (keep last 5)
        run: |
          ls -t /home/cotodev/backups/chronicles_prod_*.dmp | tail -n +6 | xargs -r rm

      - name: Clean up .env
        if: always()
        run: rm -f .env
