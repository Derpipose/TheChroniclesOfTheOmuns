name: chronicles_dev

services:
  db:
    image: postgres:16
    container_name: chronicles_dev_db
    restart: unless-stopped
    environment:
      POSTGRES_USER: chronicles_dev
      POSTGRES_PASSWORD: devpassword
      POSTGRES_DB: chroniclesdb_dev
    ports:
      - "5433:5432"
    volumes:
      - pgdata_dev:/var/lib/postgresql/data

  api:
    build:
      context: .
      dockerfile: ChroniclesAPI/Dockerfile.dev
    container_name: chronicles_dev_api
    restart: unless-stopped
    environment:
      ASPNETCORE_ENVIRONMENT: Development
      ConnectionStrings__DefaultConnection: "Host=db;Port=5432;Database=chroniclesdb_dev;Username=chronicles_dev;Password=devpassword"
      Jwt__Key: "${JWT_KEY}"
      Jwt__Issuer: "${JWT_ISSUER}"
      Jwt__Audience: "${JWT_AUDIENCE}"
      Jwt__ExpiryHours: "${JWT_EXPIRY_HOURS}"
      Smtp__Host: "${SMTP_HOST}"
      Smtp__Port: "${SMTP_PORT}"
      Smtp__Username: "${SMTP_USERNAME}"
      Smtp__Password: "${SMTP_PASSWORD}"
      Smtp__From: "${SMTP_FROM}"
    ports:
      - "5400:8080"
    volumes:
      - .:/src
    depends_on:
      - db

  react:
    build:
      context: ./PlayerAppReact
      dockerfile: Dockerfile.dev
    container_name: chronicles_dev_react
    restart: unless-stopped
    environment:
      VITE_API_BASE_URL: "http://localhost:5400"
    ports:
      - "5401:5173"
    volumes:
      - ./PlayerAppReact:/app
      - /app/node_modules
    depends_on:
      - api

volumes:
  pgdata_dev:
