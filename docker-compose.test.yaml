services:
  db_test:
    image: postgres:16
    container_name: chronicles_test_db
    restart: no
    environment:
      POSTGRES_USER: chronicles_test
      POSTGRES_PASSWORD: testpassword
      POSTGRES_DB: chroniclesdb_test
    ports:
      - "5434:5432"
    volumes:
      - pgdata_test:/var/lib/postgresql/data

volumes:
  pgdata_test: